<script>
const ALL_Q = [
{cat:"digital",diff:"Easy",
 visual:{bg:"#EEEDFE",svg:'<text x="55" y="70" font-size="48" text-anchor="middle" opacity=".3">😊</text>'},
 wow:"You send hundreds of these every day. But someone had to actually sit down and draw the first one.",
 q:"The emoji was invented in 1999 — not by Apple, not by Google. One person drew all 176 of the original emoji on a 12x12 pixel grid in just a few weeks. Where were emoji invented?",
 opts:["Japan, for a mobile carrier","USA, by Apple designers","Finland, by Nokia engineers","South Korea, for Samsung"],
 ans:0,
 name:"Emoji — Shigetaka Kurita, NTT Docomo Japan, 1999",year:"176 original emoji, each 12x12 pixels",
 story:"Shigetaka Kurita was working at a Japanese mobile company and needed a way for people to express emotion in tiny text messages. He drew 176 symbols — weather, traffic, hearts, faces — on a 12x12 pixel grid. He was inspired by manga expressions and public signage. His original 176 emoji are now in MoMA's permanent collection in New York. Apple later adopted them for iPhone in 2008. Today there are 3,600+ emoji — but they all started from those 176 hand-drawn squares.",
 facts:["Original 176 emoji now in MoMA New York","Each emoji was 12 x 12 pixels — 144 dots total","Inspired by manga facial expressions and street signs","Apple adopted Japanese emoji for the first iPhone"]},

{cat:"everyday",diff:"Easy",
 visual:{bg:"#FAECE7",svg:'<line x1="55" y1="15" x2="55" y2="75" stroke="#993C1D" stroke-width="3" stroke-linecap="round" opacity=".5"/><path d="M55 75 Q35 75 35 58 Q35 42 55 42" fill="none" stroke="#D85A30" stroke-width="3" stroke-linecap="round" opacity=".6"/><circle cx="57" cy="42" r="5" fill="#993C1D" opacity=".5"/>'},
 wow:"It holds your clothes together. It costs nothing. You've never once thought about who made it.",
 q:"The safety pin was invented in 1849 by a man who owed $15 to a friend. He sat down one morning and invented it in 3 hours specifically to earn money to pay back the debt. How much did he sell the patent for?",
 opts:["$400","$15","$1,000","$50"],
 ans:0,
 name:"Safety pin — Walter Hunt, 1849",year:"Patent sold for $400 to pay a $15 debt",
 story:"Walter Hunt owed his friend $15. He sat with a piece of wire and spent three hours inventing the safety pin. He filed a patent and sold it the same day for $400 — which was a lot of money in 1849. He used $15 to pay his debt and kept $385. The buyer made millions. Hunt went on to also invent the sewing machine, a fountain pen, and a hard coal-burning stove — but sold most of his patents cheaply. He never became rich. The safety pin has not changed once in 175 years.",
 facts:["Invented in exactly 3 hours from a piece of wire","Sold patent for $400 — used $15 to pay his debt, kept $385","The buyer made millions from it","Design completely unchanged for 175 years"]},

{cat:"everyday",diff:"Easy",
 visual:{bg:"#E1F5EE",svg:'<rect x="30" y="38" width="50" height="32" rx="4" fill="#085041" opacity=".15" stroke="#0F6E56" stroke-width="1.5"/><rect x="38" y="46" width="34" height="3" rx="1" fill="#1D9E75" opacity=".5"/><rect x="38" y="53" width="22" height="3" rx="1" fill="#1D9E75" opacity=".4"/><rect x="38" y="60" width="28" height="3" rx="1" fill="#1D9E75" opacity=".4"/>'},
 wow:"You use this to carry your school books, your lunch, your whole life. Nobody ever designed it — it just... appeared. Or did it?",
 q:"The modern zip-up backpack with padded shoulder straps was popularised globally by one brand starting in 1967. But the very first rucksack with a frame was designed for one specific purpose. What was it?",
 opts:["Carrying military supplies in Norway","Delivering milk in Switzerland","Carrying coal in Welsh mines","Transporting mail in Sweden"],
 ans:0,
 name:"Rucksack — Ole F. Bergan, Norway, 1930s",year:"Modern padded backpack popularised by JanSport, 1967",
 story:"The framed rucksack was designed by Norwegian Ole Bergan in the 1930s for military hiking. JanSport then redesigned it in 1967 with padded straps and a zipper pocket for American university students — and the modern backpack was born. Before padded straps, people carried bags by hand or with a single thin strap. The addition of two padded shoulder straps — distributing weight across the spine — was a genuinely revolutionary ergonomic design decision that we now take completely for granted.",
 facts:["Padded shoulder straps were a revolutionary ergonomic decision","JanSport made it a student object from 1967","Before this — bags were carried by hand or one strap","The spine-load distribution principle came from military hiking packs"]},

{cat:"digital",diff:"Easy",
 visual:{bg:"#EEEDFE",svg:'<rect x="22" y="35" width="66" height="46" rx="6" fill="#534AB7" opacity=".12" stroke="#3C3489" stroke-width="1"/><rect x="30" y="43" width="18" height="13" rx="2" fill="#7F77DD" opacity=".3"/><rect x="54" y="43" width="26" height="5" rx="1" fill="#AFA9EC" opacity=".4"/><rect x="54" y="52" width="18" height="5" rx="1" fill="#AFA9EC" opacity=".3"/>'},
 wow:"Every website you visit has one. You fill it out constantly. Nobody designed it to be frustrating — it just turned out that way.",
 q:"The online form — with boxes, dropdowns, and a submit button — was designed as part of the first web browser in 1993. But one element makes every form annoying. Which element was added almost as an afterthought and is now the most complained-about thing on the internet?",
 opts:["The CAPTCHA — 'prove you are human' test","The dropdown menu","The password field","The submit button"],
 ans:0,
 name:"CAPTCHA — Luis von Ahn, Carnegie Mellon, 2000",year:"'Completely Automated Public Turing test to tell Computers and Humans Apart'",
 story:"Luis von Ahn invented CAPTCHA in 2000 to stop bots from filling forms. The squiggly text you had to read came first. Then clicking fire hydrants. Then buses. He later felt guilty about wasting human time, so he invented reCAPTCHA — which used those human answers to digitize books and train Google Maps AI. Every time you clicked a fire hydrant, you were teaching self-driving cars. Von Ahn calculated that humans spend 500,000 hours per day solving CAPTCHAs. He said: 'I had created something that was wasting enormous amounts of time.'",
 facts:["Humans spend 500,000 hours per day solving CAPTCHAs globally","Inventor felt guilty and created reCAPTCHA to make it useful","Your fire hydrant clicks trained Google Maps AI","CAPTCHA stands for a 55-word full name"]},

{cat:"india",diff:"Easy",
 visual:{bg:"#FBEAF0",svg:'<rect x="20" y="40" width="70" height="40" rx="3" fill="#D4537E" opacity=".12" stroke="#993556" stroke-width="1"/><line x1="20" y1="55" x2="90" y2="55" stroke="#ED93B1" stroke-width="1" opacity=".5"/><text x="55" y="52" font-size="11" text-anchor="middle" fill="#72243E" opacity=".5">INDIA POST</text><text x="55" y="70" font-size="18" text-anchor="middle" fill="#993556" opacity=".3" font-weight="bold">25</text>'},
 wow:"Every country has one. India's most famous one was designed by a person most Indians have never heard of.",
 q:"The design of the Indian postage stamp — its distinctive border pattern and layout — was standardised in the 1940s. But which Indian object's design principle did the first Republic-era stamp directly borrow its central image from?",
 opts:["The Sarnath Lion Capital — same as the national emblem","The Red Fort — symbol of independence","The Taj Mahal — symbol of Indian art","The spinning wheel — Gandhi's symbol"],
 ans:0,
 name:"First Indian Republic stamp — Lion Capital of Ashoka, 1947",year:"Designed using the Sarnath sculpture, 250 BCE",
 story:"When India became a republic, the first stamp used the Lion Capital of Ashoka from Sarnath — the same sculpture that became the national emblem. The lions face four directions, symbolising that India speaks to the whole world. What most people don't know: the Sarnath Lion Capital was carved in 250 BCE — over 2,200 years ago. It was found buried in the ground in 1904 by British archaeologists. India chose it as its national symbol because it was already one of the greatest works of design ever created, in stone, by an Indian hand.",
 facts:["The Sarnath sculpture is 2,200 years old — carved 250 BCE","Was buried underground until 1904","Lions face 4 directions — India speaks to the whole world","Same image on all Indian currency, stamps, and the national emblem"]},

{cat:"street",diff:"Easy",
 visual:{bg:"#FAEEDA",svg:'<rect x="30" y="25" width="50" height="62" rx="25" fill="#854F0B" opacity=".15" stroke="#BA7517" stroke-width="1.5"/><circle cx="55" cy="42" r="8" fill="#EF9F27" opacity=".4"/><circle cx="55" cy="57" r="8" fill="#F1EFE8" opacity=".6" stroke="#888780" stroke-width="1"/><circle cx="55" cy="72" r="8" fill="#27500A" opacity=".4"/>'},
 wow:"You see it every day on every road. Someone decided the order. Someone decided the colors. It wasn't random.",
 q:"The traffic light was invented in 1868 — before cars even existed. It was originally designed for horse carriages. It was powered by gas, not electricity, and exploded shortly after being installed. What color was the first 'stop' signal?",
 opts:["Red — borrowed from railway signals","Green — for caution","White — the only color available","Blue — easiest to see at night"],
 ans:0,
 name:"Traffic light — J.P. Knight, London, 1868",year:"Gas-powered, exploded within months of installation",
 story:"Railway engineer J.P. Knight designed the first traffic light outside the Houses of Parliament in London in 1868. It used red for stop and green for go — borrowed directly from railway signal colors, which themselves came from ship navigation lights. The red gas lamp exploded after a few months, injuring a police officer, and traffic lights disappeared for 50 years. They returned in 1914 in the USA — electric this time. The red-amber-green sequence we use today was standardised globally in 1968. Every country on earth agreed on one single design.",
 facts:["First traffic light was for horse carriages, not cars","Gas lamp version exploded, injuring a police officer","Colors borrowed from railway — which borrowed from ships","All countries agreed on one standard design in 1968"]},

{cat:"body",diff:"Easy",
 visual:{bg:"#FAECE7",svg:'<path d="M35 80 Q35 40 55 30 Q75 40 75 80" fill="#F0997B" opacity=".15" stroke="#D85A30" stroke-width="1.5"/><line x1="40" y1="60" x2="70" y2="60" stroke="#993C1D" stroke-width="1" opacity=".4" stroke-dasharray="3,3"/><circle cx="55" cy="30" r="7" fill="#D85A30" opacity=".25"/>'},
 wow:"You wear it every single day. One tiny metal part in it was invented because of horses.",
 q:"The zip — or zipper — was invented in 1913 but wasn't used on clothes for another 20 years. For its first 20 years, it was only used on one specific thing. What was it?",
 opts:["Boots and tobacco pouches","Soldiers' uniforms","Leather bags","Tents and sleeping bags"],
 ans:0,
 name:"Zipper — Gideon Sundback, 1913",year:"First used on clothes only in 1937 — 24 years later",
 story:"Whitcomb Judson invented a clasp locker in 1893. It kept breaking. Gideon Sundback improved it in 1913 and called it the 'Hookless Fastener.' For 20 years it was used only on boots and tobacco pouches — nobody wanted it on clothes because people thought it was indecent. Too easy to open. In 1937, fashion designer Elsa Schiaparelli put zippers on her Paris collection and made them fashionable. The word 'zipper' was a brand name by B.F. Goodrich — named for the sound it makes. You use it at least 10 times a day.",
 facts:["Called 'Hookless Fastener' — not zipper — for its first 24 years","Kept off clothes because people thought it was indecent","Fashion designer Schiaparelli made it acceptable in 1937","'Zipper' is a brand name — from the sound it makes"]},

{cat:"home",diff:"Easy",
 visual:{bg:"#E6F1FB",svg:'<rect x="28" y="28" width="54" height="54" rx="4" fill="#185FA5" opacity=".1" stroke="#0C447C" stroke-width="1"/><rect x="36" y="36" width="38" height="38" rx="2" fill="#378ADD" opacity=".12"/><line x1="36" y1="55" x2="74" y2="55" stroke="#185FA5" stroke-width="1" opacity=".4"/><line x1="55" y1="36" x2="55" y2="74" stroke="#185FA5" stroke-width="1" opacity=".4"/>'},
 wow:"You've stared at one your whole life. It's the most looked-at designed object in any home. You've never wondered who designed it.",
 q:"The modern window — with a wooden or metal frame, divided into panes — became standardised during a specific period because of a tax. Which country taxed people based on how many windows their house had?",
 opts:["England — the Window Tax of 1696","France — Napoleon's glass tax","Holland — the light and air tax","Scotland — the hearth tax"],
 ans:0,
 name:"Window Tax — England, 1696 to 1851",year:"Houses with more than 10 windows paid tax",
 story:"England taxed windows from 1696 to 1851. The more windows, the higher the tax. Rich people bricked up windows to avoid it. Poor people built houses with almost no windows at all — which caused massive tuberculosis outbreaks from lack of light and ventilation. The phrase 'daylight robbery' comes from this tax — paying for light was literally robbery. This is why Victorian terraced houses have so few windows. Design is always shaped by politics and money — not just aesthetics.",
 facts:["Tax lasted from 1696 to 1851 — 155 years","'Daylight robbery' is a phrase literally from this tax","Rich people bricked up windows to avoid paying","Caused tuberculosis outbreaks from lack of ventilation in poor homes"]},

{cat:"india",diff:"Easy",
 visual:{bg:"#E1F5EE",svg:'<ellipse cx="55" cy="62" rx="28" ry="18" fill="#1D9E75" opacity=".15" stroke="#085041" stroke-width="1"/><ellipse cx="55" cy="62" rx="16" ry="10" fill="#5DCAA5" opacity=".2"/><path d="M40 50 Q55 30 70 50" fill="none" stroke="#0F6E56" stroke-width="1.5" opacity=".4"/><circle cx="55" cy="38" r="4" fill="#085041" opacity=".3"/>'},
 wow:"India drinks more of this than any other nation on earth. Nobody designed the cup — millions of hands over centuries did.",
 q:"The kulhad — the small clay tea cup used at Indian railway stations — was pushed to be used everywhere by one specific person in the 1990s as a policy decision. But what is the actual design genius of the kulhad that no paper cup can replicate?",
 opts:["It cools the tea to the perfect drinkable temperature faster","It is cheaper than paper cups","It can be reused multiple times","It keeps tea hot for longer"],
 ans:0,
 name:"Kulhad — Indian vernacular design, 3,000+ years old",year:"Railway Ministry promotion campaign, 1990s",
 story:"The kulhad's slightly porous clay walls absorb a tiny amount of moisture, which evaporates and cools the outer surface — this wicks heat from the tea inside, cooling it to the perfect drinkable temperature far faster than a glass or paper cup. This is exactly the same principle as an earthen matka cooling water. No engineer designed this. Thousands of years of potters making cups for people to drink from immediately designed it. The kulhad is also 100% biodegradable. When you throw it on the platform, it becomes mud again within weeks. The Railway Ministry promoted it specifically to reduce plastic waste.",
 facts:["Porous walls cool tea to drinkable temp through evaporation","Same principle as the earthen matka cooling water","100% biodegradable — becomes mud within weeks","Never designed by anyone — evolved through 3,000 years of use"]},

{cat:"digital",diff:"Medium",
 visual:{bg:"#EEEDFE",svg:'<rect x="22" y="30" width="66" height="55" rx="6" fill="#534AB7" opacity=".1" stroke="#3C3489" stroke-width="1"/><circle cx="40" cy="52" r="10" fill="#7F77DD" opacity=".2"/><circle cx="60" cy="52" r="10" fill="#AFA9EC" opacity=".2"/><rect x="30" y="68" width="50" height="8" rx="3" fill="#534AB7" opacity=".2"/>'},
 wow:"You've liked thousands of things with it. But who decided a thumbs up means 'I like this'?",
 q:"Facebook's Like button — the thumbs up — was almost a different symbol entirely. One designer proposed a completely different button that Zuckerberg almost used instead. What was the original proposal?",
 opts:["An 'Awesome' button — not a thumbs up","A heart — same as Instagram","A star — like Twitter favourites","A plus sign — like Google+"],
 ans:0,
 name:"Facebook Like button — Leah Pearlman & Andrew Bosworth, 2009",year:"Originally proposed as 'Awesome' button",
 story:"The Like button was proposed internally as an 'Awesome' button. Mark Zuckerberg resisted adding any reaction button for years because he was worried people would 'Like' sad posts. The thumbs up was chosen because it was universally understood across cultures and didn't require reading a word. But the thumbs up gesture actually meant something completely different in ancient Rome — it signalled death in gladiator fights. The upturned thumb meant 'finish him.' Hollywood movies got it backwards. The Like button, once launched, changed human psychology globally — introducing the concept of quantified social approval into everyday life.",
 facts:["Zuckerberg resisted adding any like button for years","Thumbs up in ancient Rome actually meant 'kill him' — Hollywood reversed it","Once live, the Like button changed global social psychology","Original name was 'Awesome button' internally"]},

{cat:"street",diff:"Easy",
 visual:{bg:"#FAEEDA",svg:'<path d="M55 20 L90 80 L20 80 Z" fill="#BA7517" opacity=".15" stroke="#854F0B" stroke-width="1.5"/><text x="55" y="68" font-size="22" text-anchor="middle" fill="#633806" opacity=".35" font-weight="bold">!</text>'},
 wow:"It's on every road in every country. A triangle with something inside. Who decided this would mean danger?",
 q:"Road warning signs — the red triangle — were standardised globally by a United Nations agreement. But the very first road sign ever installed in the world was put up in 1895 for one specific reason. What did it warn about?",
 opts:["A dangerous downhill road ahead","A bridge with a weight limit","A school crossing zone","A railway crossing"],
 ans:0,
 name:"First road sign — 1895, Chatillon-sur-Loing, France",year:"Installed by the Automobile Club de France",
 story:"The Automobile Club de France put up the first road sign in 1895 near a dangerous hill outside Paris. It simply said 'Attention' — no symbol, just the word. Within 10 years, different countries had completely different sign systems and drivers crossing borders had no idea what signs meant. The 1908 International Road Congress tried to standardise signs. A full global agreement — the Vienna Convention — wasn't signed until 1968. Even today, the USA and UK use different systems. The triangle-for-danger was chosen because triangles naturally draw the eye and feel unstable — the brain reads them as 'warning.'",
 facts:["First road sign said only the word 'Attention' — no symbol","Different countries had different signs until 1968","Triangle chosen because brain reads it as inherently unstable = warning","USA and UK still use different road sign systems today"]},

{cat:"body",diff:"Easy",
 visual:{bg:"#FBEAF0",svg:'<ellipse cx="55" cy="55" rx="28" ry="35" fill="#D4537E" opacity=".1" stroke="#993556" stroke-width="1"/><ellipse cx="55" cy="48" rx="16" ry="20" fill="#ED93B1" opacity=".15"/><line x1="35" y1="72" x2="75" y2="72" stroke="#D4537E" stroke-width="2" opacity=".3"/><line x1="42" y1="72" x2="38" y2="85" stroke="#993556" stroke-width="2" opacity=".35" stroke-linecap="round"/><line x1="68" y1="72" x2="72" y2="85" stroke="#993556" stroke-width="2" opacity=".35" stroke-linecap="round"/>'},
 wow:"You wear it every day. It was illegal for women to wear it for most of history. One person made it acceptable.",
 q:"Trousers for women were considered scandalous until the early 20th century. One specific woman wore them publicly and was arrested multiple times for it, but kept wearing them. Who was she?",
 opts:["Amelia Bloomer — social reformer, USA","Coco Chanel — fashion designer, France","Rosa Parks — civil rights activist, USA","Frida Kahlo — artist, Mexico"],

let qs=[...ALL_Q], cur=0, score=0, answered=false, hintShown=false, filterCat='all';

function setFilter(cat,el){
  filterCat=cat;
  document.querySelectorAll('.cf').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  qs=cat==='all'?[...ALL_Q]:ALL_Q.filter(q=>q.cat===cat);
  qs.sort(()=>Math.random()-.5);
  cur=0;score=0;answered=false;hintShown=false;
  updateScore();render();
}
function updateScore(){
  document.getElementById('scoreDisplay').textContent='Score: '+score;
  document.getElementById('qDisplay').textContent='Q '+(cur+1)+' / '+qs.length;
  document.getElementById('progFill').style.width=Math.round(((cur)/qs.length)*100)+'%';
}
function catClass(c){return 'cat-'+c;}
function catName(c){return{everyday:'Everyday objects',digital:'Digital life',india:'Indian things',street:'Streets & signs',body:'On your body',home:'At home'}[c]||c;}

function render(){
  updateScore();
  if(cur>=qs.length){showEnd();return;}
  const q=qs[cur];
  answered=false;hintShown=false;
  document.getElementById('gameArea').innerHTML=`
  <div class="qcard">
    <div class="qcard-top">
      <div class="q-meta">
        <span class="q-num">${cur+1} of ${qs.length}</span>
        <span class="q-cat-badge ${catClass(q.cat)}">${catName(q.cat)}</span>
        <span class="hint-icon" onclick="showHint()" id="hintBtn">Hint</span>
      </div>
      <div class="q-visual" style="background:${q.visual.bg}">
        <svg width="110" height="110" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">${q.visual.svg}</svg>
      </div>
      <div class="wow-strip">${q.wow}</div>
      <div class="q-text">${q.q}</div>
      <div class="hint-box" id="hintBox">Think about the time period: <strong>${q.year}</strong>. What problem existed then that this solved?</div>
    </div>
    <div class="opts" id="optsEl">
      ${q.opts.map((o,i)=>`<button class="opt" id="opt${i}" onclick="pick(${i})">${o}</button>`).join('')}
    </div>
    <div class="reveal-panel" id="revealPanel">
      <div class="rp-inner">
        <div class="rp-name">${q.name}</div>
        <div class="rp-year">${q.year}</div>
        <div class="rp-story">${q.story}</div>
        <div class="rp-facts">${q.facts.map(f=>`<div class="rp-fact"><span>—</span> ${f}</div>`).join('')}</div>
      </div>
    </div>
    <div class="nav-row">
      <button class="skip-btn" onclick="skip()">Skip</button>
      <button class="nav-btn" id="nextBtn" onclick="next()" disabled>Next →</button>
    </div>
  </div>`;
}
function showHint(){
  if(hintShown)return;hintShown=true;
  document.getElementById('hintBox').classList.add('show');
  document.getElementById('hintBtn').textContent='Hint shown';
  document.getElementById('hintBtn').style.opacity='0.4';
}
function pick(idx){
  if(answered)return;answered=true;
  const q=qs[cur];
  document.querySelectorAll('.opt').forEach(o=>o.disabled=true);
  if(idx===q.ans){score++;document.getElementById('opt'+idx).classList.add('correct');}
  else{document.getElementById('opt'+idx).classList.add('wrong');document.getElementById('opt'+q.ans).classList.add('reveal');}
  document.getElementById('revealPanel').classList.add('show');
  document.getElementById('nextBtn').disabled=false;
  document.getElementById('scoreDisplay').textContent='Score: '+score;
}
function skip(){answered=true;next();}
function next(){cur++;updateScore();render();}
function showEnd(){
  const pct=Math.round((score/qs.length)*100);
  let grade,msg;
  if(pct>=85){grade='Design detective';msg='You see the story behind everything. That is exactly the eye NID is looking for.';}
  else if(pct>=65){grade='Curious observer';msg='You notice things others walk past. Keep asking why about everything you touch.';}
  else if(pct>=40){grade='Waking up';msg='Every wrong answer today is a story you\'ll never forget. That\'s how design education works.';}
  else{grade='Just beginning';msg='Every single object around you has a wild story. You just started finding them. Keep going.';}
  document.getElementById('gameArea').innerHTML=`
  <div class="end-screen">
    <div class="end-score">${score} / ${qs.length}</div>
    <div class="end-sub">${pct}% correct</div>
    <div class="end-grade">${grade}</div>
    <div class="end-msg">${msg}</div>
    <button class="restart-btn" onclick="restart()">Play again</button>
  </div>`;
  document.getElementById('progFill').style.width='100%';
}
function restart(){
  cur=0;score=0;answered=false;hintShown=false;
  qs=filterCat==='all'?[...ALL_Q]:ALL_Q.filter(q=>q.cat===filterCat);
  qs.sort(()=>Math.random()-.5);render();
}
qs.sort(()=>Math.random()-.5);render();
</script>
